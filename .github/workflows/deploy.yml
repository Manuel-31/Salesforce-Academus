{
"name": "Deploy to GitHub Pages",
"on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}},
"permissions": {"contents": "read", "pages": "write", "id-token": "write"},
"concurrency": {"group": "pages", "cancel-in-progress": true},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{"name": "Find project folder", "id": "find", "run": "CONFIG=$(find . -name vite.config.ts -not -path '*/node_modules/*' | head -n 1); if [ -z \"$CONFIG\" ]; then echo not found; exit 1; fi; DIR=$(dirname \"$CONFIG\"); echo \"dir=$DIR\" >> \"$GITHUB_OUTPUT\""},
{"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
{"name": "Install", "run": "npm install", "working-directory": "${{ steps.find.outputs.dir }}"},
{"name": "Build", "run": "npm run build", "working-directory": "${{ steps.find.outputs.dir }}"},
{"uses": "actions/upload-pages-artifact@v3", "with": {"path": "${{ steps.find.outputs.dir }}/dist"}}
]
},
"deploy": {
"needs": "build",
"runs-on": "ubuntu-latest",
"environment": {"name": "github-pages", "url": "${{ steps.d.outputs.page_url }}"},
"steps": [
{"id": "d", "uses": "actions/deploy-pages@v4"}
]
}
}
}
